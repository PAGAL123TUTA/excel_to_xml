<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excel to Tally XML Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin-top: 60px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .btn-custom {
            font-size: 18px;
            padding: 10px 20px;
        }
        .btn-download {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h2 class="mb-4">🧾 Excel to Tally XML Converter</h2>
        
        <!-- Upload Form -->
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <input type="file" name="file" class="form-control form-control-lg" required>
            </div>
            <button type="submit" class="btn btn-success btn-custom w-100">
                <i class="bi bi-upload"></i> Upload & Convert
            </button>
        </form>

        <!-- Download Template -->
        <div class="btn-download">
            <a href="/static/template.xlsx" download class="btn btn-outline-secondary btn-lg shadow-sm">
                <i class="bi bi-download me-2"></i>Download Excel Template
            </a>
        </div>
    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
